[package]
name = "fzip"
version = "1.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["Tcoder LLC"]
description = "Fzip - fast portable zip tool for Windows. Reads and creates zip, with AES-256."
license = "MIT"
homepage = "https://fzip.org/"
repository = "https://github.com/xmetaads/Fzip"
readme = "README.md"
keywords = ["zip", "archive", "extract", "windows", "aes"]
categories = ["compression", "command-line-utilities"]

# Every dependency below is reachable from a code path Fzip actually runs. The
# binary is code-signed by Tcoder LLC, so anything linked into it is something
# the publisher vouches for; unused code is not free.
#
# 1.2 dropped rar, 7z, tar, gz, bz2, xz and zst, and with them thirteen crates —
# including RARLAB's UnRAR C++ sources, which are the whole WinRAR utility and
# brought four privilege APIs (AdjustTokenPrivileges, OpenProcessToken,
# LookupPrivilegeValueW, AllocateAndInitializeSid) into the import table from
# shutdown and admin-check code Fzip never called.
[dependencies]
# Archive access: map the file once, decompress its entries across every core.
memmap2 = "0.9"
rayon = "1.10"

# DEFLATE. zune-inflate is the fastest decoder available for whole-buffer work;
# flate2 handles the streaming path where the entry is too large to buffer;
# libdeflater compresses. All three are needed — they cover different shapes.
zune-inflate = "0.2"
flate2 = "1.1"
libdeflater = "1.25"
crc32fast = "1.4"

# WinZip AES (AE-1 / AE-2): PBKDF2-HMAC-SHA1, AES-CTR, HMAC-SHA1 truncated to 10.
aes = "0.8"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.4"

# Filesystem and command line.
walkdir = "2.5"
globset = "0.4"
filetime = "0.2"
rpassword = "7"

[profile.release]
lto = "fat"
codegen-units = 1
# A panic in a worker must not leave a half-written file looking finished.
# Aborting is the honest outcome; the audited bounds checks are what keep it
# from happening, and every hostile case has a regression test.
panic = "abort"
strip = true
opt-level = 3

[build-dependencies]
winresource = "0.1"
